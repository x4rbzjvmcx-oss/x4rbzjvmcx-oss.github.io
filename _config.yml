      - layout: left
        title: "Employee Attrition Analysis (IBM HR Analytics)"
        link: https://github.com/x4rbzjvmcx-oss
        quote: >
          Python + 多维可视化 | 对1470名员工的离职因素进行深度分析
        description: |
          对IBM HR数据集中的1470名员工、35个HR字段进行完整的数据清洗与探索性分析。运用Waffle图、桑基图、热力图、小提琴图等多种可视化方法，分析了员工离职的核心驱动因素，并提出了针对性的员工留存优化策略。

          **技术栈**：Python、Pandas、Matplotlib、Seaborn、Plotly

      - layout: left
        title: "Subsidy & Service Consumption Research (ML)"
        sub_title: "全国大学生统计建模大赛 — 广东省三等奖"
        caption: "2026.05"
        quote: >
          LASSO-Logit 模型 | AUC 0.828 / 0.802
        description: |
          分析广东省2016-2025年月度消费数据，构建"历史规律识别—透支风险量化—补贴优化策略"研究框架。运用LASSO-Logit等机器学习模型识别消费补贴的透支风险，评估服务消费对商品消费的承接效果，为促内需政策的精准制定提供数据支撑。

          **技术栈**：Python、Scikit-learn、LASSO回归、Logistic回归、时间序列分析

