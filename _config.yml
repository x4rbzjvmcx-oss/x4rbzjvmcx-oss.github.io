         title: 员工离职分析 (IBM HR Analytics)
         link: https://github.com/x4rbzjvmcx-oss
         quote: >
           Python + 多维可视化 | 对1470名员工的离职因素进行深度分析
         description: |
           对IBM HR数据集中的1470名员工、35个HR字段进行完整的数据清洗与探索性分析。运用 Waffle 图、桑基图、热力图、小提琴图等多种可视化方法，系统分析了员工离职的核心驱动因素，并提出了针对性的员工留存优化策略。
 
