about_content: |
  我是孙若曦，深圳大学信息管理与信息系统专业本科生（前10%），兼具技术、管理与数据分析基础的复合型背景。

  我擅长运用数据分析和机器学习方法解决实际问题，在百度之星程序设计大赛中获得省赛金奖，全国大学生统计建模大赛获得省赛三等奖。

  我是深圳大学志愿者联合会助学分会支教部长，负责「萤火虫计划」支教活动的执行与协调；同时担任金融科技学院党建工作委员会秘书部部长，统筹各级系统党务数据。

  最熟练的技能：<mark>C/C++</mark>、<mark>数据可视化</mark>、<mark>机器学习</mark>

